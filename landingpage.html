<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferry Sezen – bald online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0e1b2c;
    --dusk: #2b4a5a;
    --mist: #b9cbc9;
    --dawn: #f2c9a0;
    --snow: #f6f3ee;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--night); }
  body { font-family: var(--serif); color: var(--snow); }

  .scene { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  .content {
    position: relative; z-index: 1;
    min-height: inherit;
    display: flex; flex-direction: column; align-items: center;
    padding: 14vh 1.5rem 7vh; text-align: center;
  }
  h1 {
    margin: 0; font-weight: 300; line-height: 1.08;
    font-size: clamp(2.4rem, 7vw, 5.2rem); letter-spacing: 0.01em;
    text-shadow: 0 2px 30px rgba(8, 16, 28, 0.55);
  }
  .lead {
    margin: 1.6rem 0 0; max-width: 34rem;
    font-size: clamp(1.15rem, 2.4vw, 1.5rem); line-height: 1.5; font-weight: 500;
    color: var(--mist);
    text-shadow: 0 1px 18px rgba(8, 16, 28, 0.6);
  }
  .sign { margin-top: auto; font-size: clamp(1.1rem, 2.2vw, 1.35rem); line-height: 1.5; }
  .sign span { display: block; font-style: italic; font-weight: 400; color: var(--dawn); }
  .sign strong { display: block; margin-top: 0.15rem; font-weight: 500; font-size: 1.35em; letter-spacing: 0.04em; }

  /* Ein einziger Moment: die Sonne geht auf, danach erscheint der Text */
  .sun { animation: rise 7s cubic-bezier(.2,.6,.2,1) both; }
  @keyframes rise { from { transform: translateY(150px); opacity: .0; } to { transform: none; opacity: 1; } }
  .content > * { animation: fade 2.2s ease-out 1.2s both; }
  .content > .sign { animation-delay: 2.4s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    .sun, .content > * { animation: none; }
  }
</style>
</head>
<body>
<main class="scene">
  <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0b1626"/>
        <stop offset=".38" stop-color="#26405a"/>
        <stop offset=".56" stop-color="#9a8f9c"/>
        <stop offset=".66" stop-color="#f2c9a0"/>
        <stop offset="1" stop-color="#f7dcc0"/>
      </linearGradient>
      <radialGradient id="glow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff0d6" stop-opacity=".95"/>
        <stop offset=".35" stop-color="#f7cf9f" stop-opacity=".45"/>
        <stop offset="1" stop-color="#f2c9a0" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#cfdcd8" stop-opacity="0"/>
        <stop offset="1" stop-color="#cfdcd8" stop-opacity=".55"/>
      </linearGradient>
      <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#e9c7a4"/>
        <stop offset="1" stop-color="#2b4a5a"/>
      </linearGradient>
      <symbol id="pine" viewBox="0 0 60 150">
        <path d="M30 0 L46 44 L38 44 L52 84 L42 84 L58 128 L33 128 L33 150 L27 150 L27 128 L2 128 L18 84 L8 84 L22 44 L14 44 Z"/>
      </symbol>
    </defs>

    <rect width="1600" height="900" fill="url(#sky)"/>
    <g fill="#f6f3ee" opacity=".75">
      <circle cx="210" cy="90" r="1.6"/><circle cx="520" cy="150" r="1.2"/><circle cx="760" cy="60" r="1.5"/>
      <circle cx="1130" cy="110" r="1.4"/><circle cx="1380" cy="70" r="1.8"/><circle cx="1490" cy="190" r="1.2"/>
      <circle cx="340" cy="230" r="1.1"/><circle cx="960" cy="200" r="1.1"/>
    </g>

    <g class="sun">
      <circle cx="800" cy="520" r="260" fill="url(#glow)"/>
      <circle cx="800" cy="520" r="52" fill="#fff3dd"/>
    </g>

    <!-- ferne Kette -->
    <path fill="#6f7f98" d="M0 590 L130 500 L230 548 L390 400 L480 470 L575 430 L770 590 L905 450 L1015 520 L1185 360 L1295 460 L1405 420 L1600 545 L1600 900 L0 900Z"/>
    <path fill="#f6f3ee" opacity=".85" d="M390 400 L430 438 L410 432 L392 452 L372 430Z M1185 360 L1228 402 L1205 396 L1188 420 L1162 394Z"/>
    <!-- mittlere Kette -->
    <path fill="#3b5668" d="M0 660 L190 555 L310 620 L530 490 L650 580 L830 520 L1010 640 L1230 500 L1390 600 L1600 540 L1600 900 L0 900Z"/>
    <rect y="500" width="1600" height="260" fill="url(#mist)"/>

    <!-- See -->
    <rect y="700" width="1600" height="200" fill="url(#lake)" opacity=".9"/>
    <ellipse cx="800" cy="735" rx="90" ry="7" fill="#fff3dd" opacity=".55"/>
    <ellipse cx="800" cy="760" rx="46" ry="4" fill="#fff3dd" opacity=".35"/>

    <!-- nahe Ufer -->
    <path fill="#16292f" d="M0 730 Q170 668 360 712 T700 744 L700 900 L0 900Z"/>
    <path fill="#12232a" d="M1600 716 Q1430 660 1250 706 T930 748 L930 900 L1600 900Z"/>
    <g fill="#0f1f25">
      <use href="#pine" x="40" y="540" width="84" height="210"/>
      <use href="#pine" x="120" y="590" width="64" height="160"/>
      <use href="#pine" x="215" y="630" width="48" height="120"/>
      <use href="#pine" x="1430" y="530" width="92" height="230"/>
      <use href="#pine" x="1360" y="595" width="62" height="155"/>
      <use href="#pine" x="1285" y="640" width="46" height="115"/>
    </g>
  </svg>

  <div class="content">
    <h1>Hier entsteht eine neue Webseite</h1>
    <p class="lead">Es braucht noch ein bisschen Zeit. Schauen Sie bald wieder vorbei.</p>
    <p class="sign"><span>Herzliche Grüsse</span><strong>Ferry Sezen</strong></p>
  </div>
</main>
</body>
</html>
